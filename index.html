<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dot Square</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="welcome">
    <span>Hello, Welcome to Dot Square</span>
  </div>

  <div class="boxes">
    <div class="box">
      <h2>Student Details</h2>
      <p>Name: Mohammad Aabid Husain</p>
      <p>Class: Full Stack Development</p>
      <p>Batch: 5</p>
    </div>

    <div class="box">
      <h2>Random Image</h2>
      <img src="https://picsum.photos/600/300" alt="Random image">
    </div>

    <div class="box">
      <h2>Contact Form</h2>
      <form>
        <label>Name:</label>
        <input type="text" placeholder="Enter your name">

        <label>Email:</label>
        <input type="email" placeholder="Enter your email">

        <label>Mobile:</label>
        <input type="tel" placeholder="Enter your mobile number">
      </form>
    </div>

    <div class="box">
      <h2>Change Button Color</h2>
      <button id="colorButton">Click Me</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
